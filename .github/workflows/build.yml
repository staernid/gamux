name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux-cli:
    name: Build Linux CLI (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Fetch Steamless binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make update-steamless

      - name: Build CLI for Linux (${{ matrix.goarch }})
        run: |
          mkdir -p bin_pkg
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} go build \
            -ldflags "-s -w -X main.Version=${{ github.ref_name }}" \
            -o bin_pkg/gamux ./cmd/gamux
          cp LICENSE README.md bin_pkg/
          tar -czf gamux_linux_${{ matrix.goarch }}.tar.gz -C bin_pkg gamux LICENSE README.md
          cp bin_pkg/gamux gamux_linux_${{ matrix.goarch }}

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli_${{ matrix.goarch }}
          path: |
            gamux_linux_${{ matrix.goarch }}.tar.gz
            gamux_linux_${{ matrix.goarch }}

  build-linux-gui:
    name: Build Linux GUI (amd64) & AppImage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Linux GTK & WebKit Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build Frontend
        run: make build-frontend

      - name: Build GUI Binary (amd64)
        run: |
          GOOS=linux GOARCH=amd64 go build \
            -ldflags "-s -w -X main.Version=${{ github.ref_name }}" \
            -tags desktop,production,webkit2_41 \
            -o gamux-gui_linux_amd64 ./cmd/gamux-gui

      - name: Package GUI Tarball
        run: |
          mkdir -p gui_pkg
          cp gamux-gui_linux_amd64 gui_pkg/gamux-gui
          cp assets/io.github.staernid.gamux.desktop gui_pkg/
          cp assets/io.github.staernid.gamux.svg gui_pkg/
          cp LICENSE README.md gui_pkg/
          tar -czf gamux-gui_linux_amd64.tar.gz -C gui_pkg gamux-gui io.github.staernid.gamux.desktop io.github.staernid.gamux.svg LICENSE README.md

      - name: Build Standalone AppImage
        run: |
          ./scripts/build-appimage.sh gamux-gui_linux_amd64 gamux-gui-x86_64.AppImage

      - name: Upload GUI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gui_amd64
          path: |
            gamux-gui_linux_amd64.tar.gz
            gamux-gui-x86_64.AppImage
            gamux-gui_linux_amd64

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-linux-cli, build-linux-gui]
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
