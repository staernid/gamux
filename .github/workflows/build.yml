name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux-cli:
    name: Build Linux CLI (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Install libei Dependencies (amd64)
        if: matrix.goarch == 'amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libei-dev pkg-config

      - name: Fetch Steamless binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make update-steamless

      - name: Build CLI for Linux (${{ matrix.goarch }})
        run: |
          mkdir -p bin_pkg
          if [ "${{ matrix.goarch }}" = "amd64" ]; then
            CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build \
              -ldflags "-s -w -X main.Version=${{ github.ref_name }}" \
              -o bin_pkg/gamux ./cmd/gamux
          else
            CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
              -ldflags "-s -w -X main.Version=${{ github.ref_name }}" \
              -o bin_pkg/gamux ./cmd/gamux
          fi
          cp LICENSE README.md bin_pkg/
          tar -czf gamux-cli_linux_${{ matrix.goarch }}.tar.gz -C bin_pkg gamux LICENSE README.md
          cp bin_pkg/gamux gamux_linux_${{ matrix.goarch }}

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli_${{ matrix.goarch }}
          path: |
            gamux-cli_linux_${{ matrix.goarch }}.tar.gz
            gamux_linux_${{ matrix.goarch }}

  build-linux-unified:
    name: Build Linux Unified Release (amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Linux GTK, WebKit & libei Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libei-dev pkg-config

      - name: Fetch Steamless binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make update-steamless

      - name: Build Unified Package via Makefile
        run: |
          make package VERSION="${{ github.ref_name }}"
          cp bin/gamux gamux_linux_amd64
          cp bin/gamux-gui gamux-gui_linux_amd64
          cp bin/gamux_linux_amd64.tar.gz .

      - name: Upload Unified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unified_amd64
          path: |
            gamux_linux_amd64.tar.gz
            gamux_linux_amd64
            gamux-gui_linux_amd64

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-linux-cli, build-linux-unified]
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
