name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache: true

    - name: Build for Linux (${{ matrix.goarch }})
      run: |
        go mod tidy
        GOOS=linux GOARCH=${{ matrix.goarch }} go build -o gamux_linux_${{ matrix.goarch }} .

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: gamux_linux_${{ matrix.goarch }}
        path: gamux_linux_${{ matrix.goarch }}

  release:
    runs-on: ubuntu-latest
    needs: build-linux
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist/
        merge-multiple: true

    - name: Create release and upload assets
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
